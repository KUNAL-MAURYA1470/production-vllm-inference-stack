events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Rate limiting zone: 10 req/s per IP, 10MB shared memory
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_status 429;
    absolute_redirect off;

    upstream vllm_backend {
        server vllm:8000;
        keepalive 32;
    }

    upstream openwebui_backend {
        server openwebui:8080;
    }

    upstream grafana_backend {
        server grafana:3000;
    }

    # Redirect all plain HTTP to HTTPS
    server {
        listen 80;
        server_name _;
        return 301 https://$host:8443$request_uri;
    }

    # HTTPS API gateway + Dashboard Proxy
    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/nginx.crt;
        ssl_certificate_key /etc/nginx/certs/nginx.key;
        
        # Enterprise Grade Hardened TLS
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Production Security Headers
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: https:; frame-ancestors 'none';" always;

        # Increase timeouts for long LLM inference
        proxy_read_timeout 600s;
        proxy_connect_timeout 30s;
        proxy_send_timeout 600s;

        # Custom JSON Error Interception for API clients
        proxy_intercept_errors on;
        error_page 429 = @json_429;
        error_page 502 = @json_502;
        error_page 503 = @json_503;

        # Forward API requests /v1/ to vLLM
        location /v1/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://vllm_backend/v1/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # Required for streaming responses
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
        }

        # OpenWebUI Chat Interface
        location / {
            proxy_pass http://openwebui_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket Support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            proxy_buffering off;
        }

        # Grafana Dashboard Access
        location /grafana/ {
            proxy_pass http://grafana_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket Support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Health check passthrough
        location /health {
            proxy_pass http://vllm_backend/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Block direct access to metrics from outside
        location /metrics {
            deny all;
        }

        # Beautiful Custom JSON Error Handlers
        location @json_429 {
            default_type application/json;
            return 429 '{"error": {"message": "Too many requests. Please retry later.", "type": "rate_limit_error", "code": 429}}';
        }

        location @json_502 {
            default_type application/json;
            return 502 '{"error": {"message": "Inference server is starting up or temporarily offline. Please try again shortly.", "type": "api_error", "code": 502}}';
        }

        location @json_503 {
            default_type application/json;
            return 503 '{"error": {"message": "Inference server is temporarily overloaded or unavailable. Please try again shortly.", "type": "api_error", "code": 503}}';
        }
    }
}
