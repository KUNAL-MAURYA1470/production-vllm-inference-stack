global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'default-receiver'

receivers:
- name: 'default-receiver'
  # Production notice: Connect this to Slack, PagerDuty, or Email webhook in a real setup
  webhook_configs:
  - url: 'http://localhost:5001/' # Stub endpoint for alert delivery testing

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'dev', 'instance']
